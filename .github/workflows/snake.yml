name: Contribution snake

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/snake.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake (ink + rose palette)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=#B5577D&color_dots=#EEEBE4,#C9D6E3,#93ADC6,#5F83A8,#2F4F6F
            dist/snake-dark.svg?color_snake=#E8A3BC&color_dots=#161B22,#1C2B3A,#2F4F6F,#5F83A8,#86A7C8

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
