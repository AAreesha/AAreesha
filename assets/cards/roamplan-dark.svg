<svg xmlns="http://www.w3.org/2000/svg" width="432" height="250" viewBox="0 0 432 250" role="img" aria-label="Trip Itinerary Planner. Turns travel dates and interests into day-by-day plans that re-plan as you move a pin. About 5 hours saved per trip."><style>.sans{font-family:'Inter','Segoe UI','Helvetica Neue',-apple-system,BlinkMacSystemFont,Roboto,Arial,sans-serif}.mono{font-family:ui-monospace,'SFMono-Regular','JetBrains Mono',Menlo,Consolas,monospace}.fg{fill:#E8E4DC}.muted{fill:#8B9098}.accent{fill:#86A7C8}.rose{fill:#E8A3BC}@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}.up{opacity:0;animation:up .8s cubic-bezier(.2,.7,.2,1) forwards}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}.pulse{animation:pulse 2.4s ease-in-out infinite}@keyframes ring{0%{r:5;opacity:.7}100%{r:16;opacity:0}}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}.float{animation:float 4s ease-in-out infinite}@media (prefers-reduced-motion:reduce){.up{opacity:1;animation:none}.pulse,.float{animation:none}}.tag{font-size:11px;letter-spacing:.08em}.title{font-size:20px;font-weight:700}.desc{font-size:14px}.out{font-size:13.5px;font-weight:600}.more{font-size:12.5px}</style><rect x=".5" y=".5" width="431" height="249" rx="16" fill="#151A21" stroke="#2B3038"/><rect x=".5" y=".5" width="431" height="249" rx="16" fill="none" stroke="#E8A3BC" pathLength="1" stroke-dasharray=".12 .88" stroke-dashoffset="0" opacity=".9"><animate attributeName="stroke-dashoffset" from="0" to="-1" dur="7s" repeatCount="indefinite"/></rect><g class="float"><g transform="translate(24 22) scale(1.0)" fill="none" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="24" cy="41" rx="12" ry="3.5" stroke="#2B3038" stroke-width="1.4"/><ellipse cx="24" cy="41" rx="4" ry="1.2" stroke="#E8A3BC" stroke-width="1.4"><animate attributeName="rx" values="4;14" dur="2.2s" repeatCount="indefinite"/><animate attributeName="ry" values="1.2;4.5" dur="2.2s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0" dur="2.2s" repeatCount="indefinite"/></ellipse><path d="M24 40 C24 40 12 27 12 18 A12 12 0 0 1 36 18 C36 27 24 40 24 40 Z" stroke="#E8E4DC" stroke-width="1.6"/><circle cx="24" cy="18" r="4" stroke="#86A7C8" stroke-width="1.6"/></g></g><rect x="338" y="26" width="70" height="24" rx="12" fill="none" stroke="#2B3038"/><text x="373" y="42" text-anchor="middle" class="sans tag muted">TRAVEL</text><text x="24" y="104" class="sans title fg">Trip Itinerary Planner</text><text x="24" y="132" class="sans desc muted">Turns travel dates and interests into day-by-day</text><text x="24" y="153" class="sans desc muted">plans that re-plan as you move a pin.</text><circle cx="30" cy="220" r="4" class="rose pulse"/><text x="42" y="225" class="sans out accent">About 5 hours saved per trip</text><text x="408" y="225" text-anchor="end" class="sans more muted">View →</text></svg>
