<svg xmlns="http://www.w3.org/2000/svg" width="432" height="250" viewBox="0 0 432 250" role="img" aria-label="Operations co-pilot. Takes repetitive back-office steps off people&#x27;s plates and checks with a human before anything important changes. Hours of busywork returned weekly."><style>.sans{font-family:'Inter','Segoe UI','Helvetica Neue',-apple-system,BlinkMacSystemFont,Roboto,Arial,sans-serif}.mono{font-family:ui-monospace,'SFMono-Regular','JetBrains Mono',Menlo,Consolas,monospace}.fg{fill:#E8E4DC}.muted{fill:#8B9098}.accent{fill:#86A7C8}.rose{fill:#E8A3BC}@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}.up{opacity:0;animation:up .8s cubic-bezier(.2,.7,.2,1) forwards}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}.pulse{animation:pulse 2.4s ease-in-out infinite}@keyframes ring{0%{r:5;opacity:.7}100%{r:16;opacity:0}}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}.float{animation:float 4s ease-in-out infinite}@media (prefers-reduced-motion:reduce){.up{opacity:1;animation:none}.pulse,.float{animation:none}}.tag{font-size:11px;letter-spacing:.08em}.title{font-size:20px;font-weight:700}.desc{font-size:14px}.out{font-size:13.5px;font-weight:600}.more{font-size:12.5px}</style><rect x=".5" y=".5" width="431" height="249" rx="16" fill="#151A21" stroke="#2B3038"/><rect x=".5" y=".5" width="431" height="249" rx="16" fill="none" stroke="#E8A3BC" pathLength="1" stroke-dasharray=".12 .88" stroke-dashoffset="0" opacity=".9"><animate attributeName="stroke-dashoffset" from="0" to="-1" dur="7s" repeatCount="indefinite"/></rect><g class="float"><g transform="translate(24 22) scale(1.0)" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M8 12 H24 V36 H40" stroke="#2B3038" stroke-width="1.6"/><circle cx="8" cy="12" r="5" stroke="#E8E4DC" stroke-width="1.6"/><circle cx="24" cy="24" r="5" stroke="#E8E4DC" stroke-width="1.6"/><circle cx="40" cy="36" r="5" stroke="#86A7C8" stroke-width="1.6"/><circle r="2.4" fill="#86A7C8" stroke="none"><animateMotion dur="2.6s" repeatCount="indefinite" path="M8 12 H24 V36 H40"/></circle></g></g><rect x="308" y="26" width="100" height="24" rx="12" fill="none" stroke="#2B3038"/><text x="358" y="42" text-anchor="middle" class="sans tag muted">AUTOMATION</text><text x="24" y="104" class="sans title fg">Operations co-pilot</text><text x="24" y="132" class="sans desc muted">Takes repetitive back-office steps off people&#x27;s</text><text x="24" y="153" class="sans desc muted">plates and checks with a human before anything</text><text x="24" y="174" class="sans desc muted">important changes.</text><circle cx="30" cy="220" r="4" class="rose pulse"/><text x="42" y="225" class="sans out accent">Hours of busywork returned weekly</text><text x="408" y="225" text-anchor="end" class="sans more muted">View →</text></svg>
