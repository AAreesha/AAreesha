<svg xmlns="http://www.w3.org/2000/svg" width="432" height="250" viewBox="0 0 432 250" role="img" aria-label="Adaptive Learning Platform. Reshapes every lesson and quiz around what each learner still needs to practise. Completion up from 35% to 78%."><style>.sans{font-family:'Inter','Segoe UI','Helvetica Neue',-apple-system,BlinkMacSystemFont,Roboto,Arial,sans-serif}.mono{font-family:ui-monospace,'SFMono-Regular','JetBrains Mono',Menlo,Consolas,monospace}.fg{fill:#E8E4DC}.muted{fill:#8B9098}.accent{fill:#86A7C8}.rose{fill:#E8A3BC}.berry{fill:#D9578A}@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}.up{opacity:0;animation:up .8s cubic-bezier(.2,.7,.2,1) forwards}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}.pulse{animation:pulse 2.4s ease-in-out infinite}@keyframes ring{0%{r:5;opacity:.7}100%{r:16;opacity:0}}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}.float{animation:float 4s ease-in-out infinite}@media (prefers-reduced-motion:reduce){.up{opacity:1;animation:none}.pulse,.float{animation:none}}.tag{font-size:11px;letter-spacing:.08em}.title{font-size:20px;font-weight:700}.desc{font-size:14px}.out{font-size:13.5px;font-weight:600}.more{font-size:12.5px}</style><rect x=".5" y=".5" width="431" height="249" rx="16" fill="#151A21" stroke="#2B3038"/><rect x=".5" y=".5" width="431" height="249" rx="16" fill="none" stroke="#E8A3BC" pathLength="1" stroke-dasharray=".12 .88" stroke-dashoffset="0" opacity=".9"><animate attributeName="stroke-dashoffset" from="0" to="-1" dur="7s" repeatCount="indefinite"/></rect><g class="float"><g transform="translate(24 22) scale(1.0)" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="6" width="16" height="16" rx="4" stroke="#E8E4DC" stroke-width="1.6" class="pulse" style="animation-delay:0.0s;animation-duration:3.2s"/><rect x="26" y="6" width="16" height="16" rx="4" stroke="#E8E4DC" stroke-width="1.6" class="pulse" style="animation-delay:0.4s;animation-duration:3.2s"/><rect x="6" y="26" width="16" height="16" rx="4" stroke="#E8E4DC" stroke-width="1.6" class="pulse" style="animation-delay:0.8s;animation-duration:3.2s"/><rect x="26" y="26" width="16" height="16" rx="4" stroke="#86A7C8" stroke-width="1.6" class="pulse" style="animation-delay:1.2000000000000002s;animation-duration:3.2s"/></g></g><rect x="316" y="26" width="92" height="24" rx="12" fill="none" stroke="#D9578A" stroke-opacity=".7"/><text x="362" y="42" text-anchor="middle" class="sans tag muted">EDUCATION</text><text x="24" y="104" class="sans title fg">Adaptive Learning Platform</text><text x="24" y="132" class="sans desc muted">Reshapes every lesson and quiz around what each</text><text x="24" y="153" class="sans desc muted">learner still needs to practise.</text><circle cx="30" cy="220" r="4" class="rose pulse"/><text x="42" y="225" class="sans out accent">Completion up from 35% to 78%</text><text x="408" y="225" text-anchor="end" class="sans more muted">View →</text></svg>
