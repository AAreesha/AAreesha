<svg xmlns="http://www.w3.org/2000/svg" width="432" height="250" viewBox="0 0 432 250" role="img" aria-label="Used-Car Price Estimator. Prices a used car from its listing photos, even from a single exterior shot. Within 8% of the final sale price."><style>.sans{font-family:'Inter','Segoe UI','Helvetica Neue',-apple-system,BlinkMacSystemFont,Roboto,Arial,sans-serif}.mono{font-family:ui-monospace,'SFMono-Regular','JetBrains Mono',Menlo,Consolas,monospace}.fg{fill:#1C1E21}.muted{fill:#676C73}.accent{fill:#2F4F6F}.rose{fill:#B5577D}@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}.up{opacity:0;animation:up .8s cubic-bezier(.2,.7,.2,1) forwards}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}.pulse{animation:pulse 2.4s ease-in-out infinite}@keyframes ring{0%{r:5;opacity:.7}100%{r:16;opacity:0}}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}.float{animation:float 4s ease-in-out infinite}@media (prefers-reduced-motion:reduce){.up{opacity:1;animation:none}.pulse,.float{animation:none}}.tag{font-size:11px;letter-spacing:.08em}.title{font-size:20px;font-weight:700}.desc{font-size:14px}.out{font-size:13.5px;font-weight:600}.more{font-size:12.5px}</style><rect x=".5" y=".5" width="431" height="249" rx="16" fill="#F6F4EF" stroke="#D8D3C9"/><rect x=".5" y=".5" width="431" height="249" rx="16" fill="none" stroke="#B5577D" pathLength="1" stroke-dasharray=".12 .88" stroke-dashoffset="0" opacity=".9"><animate attributeName="stroke-dashoffset" from="0" to="-1" dur="7s" repeatCount="indefinite"/></rect><g class="float"><g transform="translate(24 22) scale(1.0)" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M6 34 A18 18 0 0 1 42 34" stroke="#D8D3C9" stroke-width="3"/><path d="M6 34 A18 18 0 0 1 32 18" stroke="#2F4F6F" stroke-width="3"/><g><line x1="24" y1="34" x2="24" y2="20" stroke="#1C1E21" stroke-width="1.8"/><animateTransform attributeName="transform" type="rotate" values="-50 24 34;40 24 34;-50 24 34" dur="4s" repeatCount="indefinite"/></g><circle cx="24" cy="34" r="3" fill="#1C1E21" stroke="none"/></g></g><rect x="270" y="26" width="138" height="24" rx="12" fill="none" stroke="#D8D3C9"/><text x="339" y="42" text-anchor="middle" class="sans tag muted">COMPUTER VISION</text><text x="24" y="104" class="sans title fg">Used-Car Price Estimator</text><text x="24" y="132" class="sans desc muted">Prices a used car from its listing photos, even</text><text x="24" y="153" class="sans desc muted">from a single exterior shot.</text><circle cx="30" cy="220" r="4" class="rose pulse"/><text x="42" y="225" class="sans out accent">Within 8% of the final sale price</text><text x="408" y="225" text-anchor="end" class="sans more muted">View →</text></svg>
