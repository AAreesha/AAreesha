<svg xmlns="http://www.w3.org/2000/svg" width="150" height="46" viewBox="0 0 150 46" role="img" aria-label="Portfolio"><style>.sans{font-family:'Inter','Segoe UI','Helvetica Neue',-apple-system,BlinkMacSystemFont,Roboto,Arial,sans-serif}.mono{font-family:ui-monospace,'SFMono-Regular','JetBrains Mono',Menlo,Consolas,monospace}.fg{fill:#E8E4DC}.muted{fill:#8B9098}.accent{fill:#86A7C8}.rose{fill:#E8A3BC}.berry{fill:#D9578A}@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}.up{opacity:0;animation:up .8s cubic-bezier(.2,.7,.2,1) forwards}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}.pulse{animation:pulse 2.4s ease-in-out infinite}@keyframes ring{0%{r:5;opacity:.7}100%{r:16;opacity:0}}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}.float{animation:float 4s ease-in-out infinite}@media (prefers-reduced-motion:reduce){.up{opacity:1;animation:none}.pulse,.float{animation:none}}.b{font-size:14.5px;font-weight:600}</style><rect x="1" y="1" width="148" height="44" rx="23" fill="#151A21" stroke="#86A7C8" stroke-width="1.3"/><text x="69" y="28.5" text-anchor="middle" class="sans b fg" dx="-6">Portfolio</text><text x="114" y="28.5" class="sans b rose">→<animate attributeName="x" values="112;117;112" dur="1.8s" repeatCount="indefinite"/></text></svg>
