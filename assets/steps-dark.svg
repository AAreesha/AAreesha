<svg xmlns="http://www.w3.org/2000/svg" width="880" height="190" viewBox="0 0 880 190" role="img" aria-label="Listen: Understand the people and the real problem. → Design: Plan the simplest thing that will hold up. → Build: Ship early, test often, improve every week. → Care: Launch, watch closely, keep it running."><style>.sans{font-family:'Inter','Segoe UI','Helvetica Neue',-apple-system,BlinkMacSystemFont,Roboto,Arial,sans-serif}.mono{font-family:ui-monospace,'SFMono-Regular','JetBrains Mono',Menlo,Consolas,monospace}.fg{fill:#E8E4DC}.muted{fill:#8B9098}.accent{fill:#86A7C8}.rose{fill:#E8A3BC}.berry{fill:#D9578A}@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}.up{opacity:0;animation:up .8s cubic-bezier(.2,.7,.2,1) forwards}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}.pulse{animation:pulse 2.4s ease-in-out infinite}@keyframes ring{0%{r:5;opacity:.7}100%{r:16;opacity:0}}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}.float{animation:float 4s ease-in-out infinite}@media (prefers-reduced-motion:reduce){.up{opacity:1;animation:none}.pulse,.float{animation:none}}.st{font-size:17px;font-weight:700}.sd{font-size:13.5px}.sn{font-size:12px;font-weight:700}</style><line x1="70" y1="40" x2="810" y2="40" stroke="#2B3038" stroke-width="2"/><line x1="70" y1="40" x2="810" y2="40" stroke="#E8A3BC" stroke-width="2" pathLength="1" stroke-dasharray=".18 .82"><animate attributeName="stroke-dashoffset" from=".18" to="-1" dur="4s" repeatCount="indefinite"/></line><g class="up" style="animation-delay:0.00s"><circle cx="70" cy="40" r="22" fill="#151A21" stroke="#E8E4DC" stroke-width="1.6"/><text x="70" y="44.5" text-anchor="middle" class="sans sn fg">01</text><text x="70" y="96" text-anchor="middle" class="sans st fg">Listen</text><text x="70" y="122" text-anchor="middle" class="sans sd muted">Understand the people</text><text x="70" y="141" text-anchor="middle" class="sans sd muted">and the real problem.</text></g><g class="up" style="animation-delay:0.25s"><circle cx="317" cy="40" r="22" fill="#151A21" stroke="#E8E4DC" stroke-width="1.6"/><text x="317" y="44.5" text-anchor="middle" class="sans sn fg">02</text><text x="317" y="96" text-anchor="middle" class="sans st fg">Design</text><text x="317" y="122" text-anchor="middle" class="sans sd muted">Plan the simplest thing</text><text x="317" y="141" text-anchor="middle" class="sans sd muted">that will hold up.</text></g><g class="up" style="animation-delay:0.50s"><circle cx="563" cy="40" r="22" fill="#151A21" stroke="#E8E4DC" stroke-width="1.6"/><text x="563" y="44.5" text-anchor="middle" class="sans sn fg">03</text><text x="563" y="96" text-anchor="middle" class="sans st fg">Build</text><text x="563" y="122" text-anchor="middle" class="sans sd muted">Ship early, test often,</text><text x="563" y="141" text-anchor="middle" class="sans sd muted">improve every week.</text></g><g class="up" style="animation-delay:0.75s"><circle cx="810" cy="40" r="22" fill="#151A21" stroke="#86A7C8" stroke-width="1.6"/><text x="810" y="44.5" text-anchor="middle" class="sans sn fg">04</text><text x="810" y="96" text-anchor="middle" class="sans st fg">Care</text><text x="810" y="122" text-anchor="middle" class="sans sd muted">Launch, watch closely,</text><text x="810" y="141" text-anchor="middle" class="sans sd muted">keep it running.</text></g><circle cx="810" cy="40" r="5" fill="none" stroke="#86A7C8"><animate attributeName="r" values="22;34" dur="2.4s" repeatCount="indefinite"/><animate attributeName="opacity" values=".8;0" dur="2.4s" repeatCount="indefinite"/></circle></svg>
