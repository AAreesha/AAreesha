<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300" role="img" aria-label="Hi, I&#x27;m Areesha Amir. I turn AI ideas into products people can rely on."><style>.sans{font-family:'Inter','Segoe UI','Helvetica Neue',-apple-system,BlinkMacSystemFont,Roboto,Arial,sans-serif}.mono{font-family:ui-monospace,'SFMono-Regular','JetBrains Mono',Menlo,Consolas,monospace}.fg{fill:#E8E4DC}.muted{fill:#8B9098}.accent{fill:#86A7C8}@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}.up{opacity:0;animation:up .8s cubic-bezier(.2,.7,.2,1) forwards}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}.pulse{animation:pulse 2.4s ease-in-out infinite}@keyframes ring{0%{r:5;opacity:.7}100%{r:16;opacity:0}}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}.float{animation:float 4s ease-in-out infinite}@media (prefers-reduced-motion:reduce){.up{opacity:1;animation:none}.pulse,.float{animation:none}}.name{font-size:50px;font-weight:700;letter-spacing:-.02em}.lead{font-size:19px}.pill{font-size:12px;letter-spacing:.06em}.typed{font-size:15px}@keyframes t0{0%{width:0}15.00%{width:324px}30.67%{width:324px}33.33%{width:0}100%{width:0}}.c0{width:0;animation:t0 12.0s steps(35,end) 1.2s infinite}@keyframes t1{0%{width:0}15.00%{width:343px}30.67%{width:343px}33.33%{width:0}100%{width:0}}.c1{width:0;animation:t1 12.0s steps(37,end) 5.2s infinite}@keyframes t2{0%{width:0}15.00%{width:297px}30.67%{width:297px}33.33%{width:0}100%{width:0}}.c2{width:0;animation:t2 12.0s steps(32,end) 9.2s infinite}</style><g opacity=".95"><circle cx="735" cy="150" r="110" fill="none" stroke="#2B3038" stroke-dasharray="2 6"/><circle cx="735" cy="150" r="78" fill="none" stroke="#2B3038"/><circle cx="735" cy="150" r="44" fill="none" stroke="#2B3038"/><circle cx="735" cy="150" r="22" fill="#86A7C8" opacity=".18" class="pulse"/><circle cx="735" cy="150" r="9" fill="#86A7C8"/><g><circle cx="779" cy="150" r="4" fill="#E8E4DC"/><animateTransform attributeName="transform" type="rotate" from="0 735 150" to="360 735 150" dur="7s" repeatCount="indefinite"/></g><g><circle cx="813" cy="150" r="5" fill="#86A7C8"/><animateTransform attributeName="transform" type="rotate" from="120 735 150" to="480 735 150" dur="13s" repeatCount="indefinite"/></g><g><circle cx="813" cy="150" r="3" fill="#E8E4DC"/><animateTransform attributeName="transform" type="rotate" from="300 735 150" to="660 735 150" dur="13s" repeatCount="indefinite"/></g><g><circle cx="845" cy="150" r="4" fill="#86A7C8"/><animateTransform attributeName="transform" type="rotate" from="200 735 150" to="560 735 150" dur="21s" repeatCount="indefinite"/></g></g><g class="up" style="animation-delay:.1s"><rect x="0" y="18" width="232" height="30" rx="15" fill="#151A21" stroke="#2B3038"/><circle cx="18" cy="33" r="4.5" class="accent pulse"/><text x="32" y="37.5" class="sans pill fg">OPEN TO OPPORTUNITIES</text></g><text x="0" y="118" class="sans name fg up" style="animation-delay:.3s">Hi, I'm Areesha Amir<tspan class="accent">.</tspan></text><text x="0" y="158" class="sans lead muted up" style="animation-delay:.55s">I turn AI ideas into products people can rely on.</text><line x1="0" y1="190" x2="520" y2="190" stroke="#2B3038"/><line x1="0" y1="190" x2="520" y2="190" stroke="#86A7C8" stroke-width="2" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"><animate attributeName="stroke-dashoffset" from="1" to="0" begin=".8s" dur="1.4s" fill="freeze"/></line><text x="0" y="240" class="mono typed accent">›</text><clipPath id="k0"><rect class="c0" x="22" y="222" height="24"/></clipPath><text x="22" y="240" class="mono typed fg" clip-path="url(#k0)">Ideas into products people rely on.</text><clipPath id="k1"><rect class="c1" x="22" y="222" height="24"/></clipPath><text x="22" y="240" class="mono typed fg" clip-path="url(#k1)">Built for real users, not just demos.</text><clipPath id="k2"><rect class="c2" x="22" y="222" height="24"/></clipPath><text x="22" y="240" class="mono typed fg" clip-path="url(#k2)">Fast, affordable, and always on.</text></svg>
