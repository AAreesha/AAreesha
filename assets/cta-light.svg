<svg xmlns="http://www.w3.org/2000/svg" width="880" height="190" viewBox="0 0 880 190" role="img" aria-label="Let&#x27;s build something that lasts. Open to graduate scholarships, research, and AI product roles."><style>.sans{font-family:'Inter','Segoe UI','Helvetica Neue',-apple-system,BlinkMacSystemFont,Roboto,Arial,sans-serif}.mono{font-family:ui-monospace,'SFMono-Regular','JetBrains Mono',Menlo,Consolas,monospace}.fg{fill:#1C1E21}.muted{fill:#676C73}.accent{fill:#2F4F6F}.rose{fill:#B5577D}.berry{fill:#9C2358}@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}.up{opacity:0;animation:up .8s cubic-bezier(.2,.7,.2,1) forwards}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}.pulse{animation:pulse 2.4s ease-in-out infinite}@keyframes ring{0%{r:5;opacity:.7}100%{r:16;opacity:0}}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}.float{animation:float 4s ease-in-out infinite}@media (prefers-reduced-motion:reduce){.up{opacity:1;animation:none}.pulse,.float{animation:none}}.big{font-size:32px;font-weight:700;letter-spacing:-.02em}.sub{font-size:16px}</style><rect x="1" y="1" width="878" height="188" rx="20" fill="#F6F4EF" stroke="#D8D3C9"/><rect x="1" y="1" width="878" height="188" rx="20" fill="none" stroke="#B5577D" stroke-width="1.5" pathLength="1" stroke-dasharray=".2 .8"><animate attributeName="stroke-dashoffset" from="0" to="-1" dur="8s" repeatCount="indefinite"/></rect><text x="440" y="84" text-anchor="middle" class="sans big fg up">Let's build something that lasts<tspan class="rose">.</tspan></text><text x="440" y="118" text-anchor="middle" class="sans sub muted up" style="animation-delay:.25s">Open to graduate scholarships, research, and AI product roles.</text><g class="up" style="animation-delay:.5s"><circle cx="348" cy="148" r="4.5" class="rose pulse"/><text x="360" y="152.5" class="mono muted" style="font-size:12.5px">xmireesha@gmail.com</text></g></svg>
