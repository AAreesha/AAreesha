<svg xmlns="http://www.w3.org/2000/svg" width="880" height="566" viewBox="0 0 880 566" role="img" aria-label="Now: AI Product Architect, Self-employed · 2024–25: AI Consultant, Independent · 2025: AI/ML Engineer, JBS (Jaffar Brothers) · 2025: AI/ML Engineer, Vettio · 2025: Research Intern, AI @ Dartmouth · 2025: Frontend Engineer, Securiti · 2021–25: BS Computer Science, Habib University"><style>.sans{font-family:'Inter','Segoe UI','Helvetica Neue',-apple-system,BlinkMacSystemFont,Roboto,Arial,sans-serif}.mono{font-family:ui-monospace,'SFMono-Regular','JetBrains Mono',Menlo,Consolas,monospace}.fg{fill:#1C1E21}.muted{fill:#676C73}.accent{fill:#2F4F6F}.rose{fill:#B5577D}.berry{fill:#9C2358}@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}.up{opacity:0;animation:up .8s cubic-bezier(.2,.7,.2,1) forwards}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}.pulse{animation:pulse 2.4s ease-in-out infinite}@keyframes ring{0%{r:5;opacity:.7}100%{r:16;opacity:0}}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}.float{animation:float 4s ease-in-out infinite}@media (prefers-reduced-motion:reduce){.up{opacity:1;animation:none}.pulse,.float{animation:none}}.jy{font-size:12px;letter-spacing:.08em;font-weight:700}.jr{font-size:17px;font-weight:700}.jw{font-size:15px;font-weight:600}.jd{font-size:13.5px}</style><line x1="132" y1="28" x2="132" y2="516" stroke="#D8D3C9" stroke-width="2"/><line x1="132" y1="28" x2="132" y2="516" stroke="#9C2358" stroke-width="2" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"><animate attributeName="stroke-dashoffset" from="1" to="0" dur="2.6s" fill="freeze"/></line><g class="up" style="animation-delay:0.00s"><text x="106" y="33" text-anchor="end" class="sans jy rose">NOW</text><circle cx="132" cy="28" r="7" fill="#B5577D" stroke="#B5577D" stroke-width="2"/><text x="160" y="34" class="sans jr fg">AI Product Architect<tspan class="muted" style="font-weight:400">  ·  </tspan><tspan class="jw berry">Self-employed</tspan></text><text x="160" y="58" class="sans jd muted">Turning stalled AI demos into products that hold up with real users and real costs.</text></g><g class="up" style="animation-delay:0.30s"><text x="106" y="111" text-anchor="end" class="sans jy muted">2024–25</text><circle cx="132" cy="106" r="7" fill="#F6F4EF" stroke="#2F4F6F" stroke-width="2"/><text x="160" y="112" class="sans jr fg">AI Consultant<tspan class="muted" style="font-weight:400">  ·  </tspan><tspan class="jw berry">Independent</tspan></text><text x="160" y="136" class="sans jd muted">Shipped a learning platform, voice agents and a triage assistant for education, HR and healthcare.</text></g><g class="up" style="animation-delay:0.60s"><text x="106" y="189" text-anchor="end" class="sans jy muted">2025</text><circle cx="132" cy="184" r="7" fill="#F6F4EF" stroke="#2F4F6F" stroke-width="2"/><text x="160" y="190" class="sans jr fg">AI/ML Engineer<tspan class="muted" style="font-weight:400">  ·  </tspan><tspan class="jw berry">JBS (Jaffar Brothers)</tspan></text><text x="160" y="214" class="sans jd muted">A year of end-to-end machine learning, from data pipelines to models in production.</text></g><g class="up" style="animation-delay:0.90s"><text x="106" y="267" text-anchor="end" class="sans jy muted">2025</text><circle cx="132" cy="262" r="7" fill="#F6F4EF" stroke="#2F4F6F" stroke-width="2"/><text x="160" y="268" class="sans jr fg">AI/ML Engineer<tspan class="muted" style="font-weight:400">  ·  </tspan><tspan class="jw berry">Vettio</tspan></text><text x="160" y="292" class="sans jd muted">AI features for hiring and job-seeking software.</text></g><g class="up" style="animation-delay:1.20s"><text x="106" y="345" text-anchor="end" class="sans jy muted">2025</text><circle cx="132" cy="340" r="7" fill="#F6F4EF" stroke="#2F4F6F" stroke-width="2"/><text x="160" y="346" class="sans jr fg">Research Intern<tspan class="muted" style="font-weight:400">  ·  </tspan><tspan class="jw berry">AI @ Dartmouth</tspan></text><text x="160" y="370" class="sans jd muted">Built a resume screening tool and a programming elective the university now teaches.</text></g><g class="up" style="animation-delay:1.50s"><text x="106" y="423" text-anchor="end" class="sans jy muted">2025</text><circle cx="132" cy="418" r="7" fill="#F6F4EF" stroke="#2F4F6F" stroke-width="2"/><text x="160" y="424" class="sans jr fg">Frontend Engineer<tspan class="muted" style="font-weight:400">  ·  </tspan><tspan class="jw berry">Securiti</tspan></text><text x="160" y="448" class="sans jd muted">Product interfaces built with a careful eye for design.</text></g><g class="up" style="animation-delay:1.80s"><text x="106" y="501" text-anchor="end" class="sans jy muted">2021–25</text><circle cx="132" cy="496" r="7" fill="#F6F4EF" stroke="#2F4F6F" stroke-width="2"/><text x="160" y="502" class="sans jr fg">BS Computer Science<tspan class="muted" style="font-weight:400">  ·  </tspan><tspan class="jw berry">Habib University</tspan></text><text x="160" y="526" class="sans jd muted">Full scholarship, 3.8 GPA, Dean&#x27;s and President&#x27;s Lists.</text></g><circle cx="132" cy="28" r="7" fill="none" stroke="#B5577D"><animate attributeName="r" values="7;20" dur="2.4s" repeatCount="indefinite"/><animate attributeName="opacity" values=".8;0" dur="2.4s" repeatCount="indefinite"/></circle></svg>
