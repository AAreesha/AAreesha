<svg xmlns="http://www.w3.org/2000/svg" width="880" height="180" viewBox="0 0 880 180" role="img" aria-label="2021: Full scholarship to Habib University → Each term: Dean&#x27;s and President&#x27;s Lists → 2024: 1st runner-up, IFTP at Texas A&amp;M → 2025: BS Computer Science, 3.8 GPA → Now: 20+ products across 6 industries"><style>.sans{font-family:'Inter','Segoe UI','Helvetica Neue',-apple-system,BlinkMacSystemFont,Roboto,Arial,sans-serif}.mono{font-family:ui-monospace,'SFMono-Regular','JetBrains Mono',Menlo,Consolas,monospace}.fg{fill:#1C1E21}.muted{fill:#676C73}.accent{fill:#2F4F6F}@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}.up{opacity:0;animation:up .8s cubic-bezier(.2,.7,.2,1) forwards}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}.pulse{animation:pulse 2.4s ease-in-out infinite}@keyframes ring{0%{r:5;opacity:.7}100%{r:16;opacity:0}}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}.float{animation:float 4s ease-in-out infinite}@media (prefers-reduced-motion:reduce){.up{opacity:1;animation:none}.pulse,.float{animation:none}}.jy{font-size:12px;letter-spacing:.08em;font-weight:700}.jd{font-size:13.5px}</style><line x1="80" y1="56" x2="800" y2="56" stroke="#2F4F6F" stroke-width="2" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"><animate attributeName="stroke-dashoffset" from="1" to="0" dur="2.4s" fill="freeze"/></line><g class="up" style="animation-delay:0.00s"><text x="80" y="30" text-anchor="middle" class="sans jy muted">2021</text><circle cx="80" cy="56" r="8" fill="#F6F4EF" stroke="#2F4F6F" stroke-width="2"/><text x="80" y="94" text-anchor="middle" class="sans jd muted">Full scholarship to</text><text x="80" y="113" text-anchor="middle" class="sans jd muted">Habib University</text></g><g class="up" style="animation-delay:0.45s"><text x="260" y="30" text-anchor="middle" class="sans jy muted">EACH TERM</text><circle cx="260" cy="56" r="8" fill="#F6F4EF" stroke="#2F4F6F" stroke-width="2"/><text x="260" y="94" text-anchor="middle" class="sans jd muted">Dean&#x27;s and</text><text x="260" y="113" text-anchor="middle" class="sans jd muted">President&#x27;s Lists</text></g><g class="up" style="animation-delay:0.90s"><text x="440" y="30" text-anchor="middle" class="sans jy muted">2024</text><circle cx="440" cy="56" r="8" fill="#F6F4EF" stroke="#2F4F6F" stroke-width="2"/><text x="440" y="94" text-anchor="middle" class="sans jd muted">1st runner-up, IFTP</text><text x="440" y="113" text-anchor="middle" class="sans jd muted">at Texas A&amp;M</text></g><g class="up" style="animation-delay:1.35s"><text x="620" y="30" text-anchor="middle" class="sans jy muted">2025</text><circle cx="620" cy="56" r="8" fill="#F6F4EF" stroke="#2F4F6F" stroke-width="2"/><text x="620" y="94" text-anchor="middle" class="sans jd muted">BS Computer Science,</text><text x="620" y="113" text-anchor="middle" class="sans jd muted">3.8 GPA</text></g><g class="up" style="animation-delay:1.80s"><text x="800" y="30" text-anchor="middle" class="sans jy accent">NOW</text><circle cx="800" cy="56" r="8" fill="#2F4F6F" stroke="#2F4F6F" stroke-width="2"/><text x="800" y="94" text-anchor="middle" class="sans jd fg">20+ products across</text><text x="800" y="113" text-anchor="middle" class="sans jd fg">6 industries</text></g><circle cx="800" cy="56" r="8" fill="none" stroke="#2F4F6F"><animate attributeName="r" values="8;22" dur="2.4s" repeatCount="indefinite"/><animate attributeName="opacity" values=".8;0" dur="2.4s" repeatCount="indefinite"/></circle></svg>
